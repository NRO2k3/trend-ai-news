name: Cập nhật và đăng trang

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Lấy dữ liệu mới
        run: node scripts/build.js
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, so leave an empty commit before that happens.
      - name: Giữ lịch chạy tự động
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Giữ lịch cập nhật tự động'
            git push
          fi
